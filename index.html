<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo-kepa.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kepastelito</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
  </head>
  <script>
    window.onerror = function(msg, src, line, col, err) {
      document.body.style.background = '#fff';
      document.body.innerHTML = '<div style="padding:20px;color:red;font-family:monospace;font-size:13px">'
        + '<b>ERROR:</b><br>' + msg + '<br><br>'
        + '<b>Archivo:</b> ' + src + '<br>'
        + '<b>Línea:</b> ' + line + ':' + col + '<br><br>'
        + (err ? err.stack : '')
        + '</div>';
    };
  </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
